baseURL = 'https://randomaccessvemuri.github.io/cybersec-blog/'
languageCode = 'en-us'
title = 'vemuri'
DefaultContentLanguage = 'en'
enableRobotsTXT = true
enableGitInfo = true
summaryLength = 40

[pagination]
  pagerSize = 12

[params]
  author = 'Tanmay Vemuri'
  tagline = 'Offensive security notes — HTB writeups, enumeration paths, and privilege escalation.'
  description = 'Cybersecurity writeups and lab notes by Tanmay Vemuri.'
  github = 'https://github.com/randomaccessvemuri'
  mainSections = ['posts']

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'nord'
    lineNos = true
    lineNumbersInTable = false
    noClasses = true

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
