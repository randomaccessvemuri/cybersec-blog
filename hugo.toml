baseURL = 'https://randomaccessvemuri.github.io/cybersec-blog/'
languageCode = 'en-us'
title = 'Writeups, Scripts, & Security Stuff'
DefaultContentLanguage = "en"
enableInlineShortcodes = true
footnoteReturnLinkContents = "^"
enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[Params.author]
  name = "Tanmay Vemuri"
  abstract = """
  Offensive security enthusiast pursuing OSCP and Security+ certifications.
  Passionate about penetration testing, vulnerability research, and ethical hacking.
  Student at Manipal Institute of Technology, Bangalore, India.
  """

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "paraiso-dark"
    lineNos = true
    lineNumbersInTable = false

[Params]
  darkmode = true
  backtotop = true
  toc = true
  mainSections = ["posts"]

theme="HugoTeX"

customSCSS = ["scss/custom.scss"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
